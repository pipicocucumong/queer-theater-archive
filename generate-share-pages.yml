name: Generate performance share pages

on:
  workflow_dispatch:
  schedule:
    # WordPress에서 새 공연/포스터를 수정했을 때 자동 갱신.
    # GitHub scheduled workflows can run a little later than the exact minute.
    - cron: "17,47 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "scripts/generate_share_pages.py"
      - ".github/workflows/generate-share-pages.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate static social share pages
        run: python scripts/generate_share_pages.py

      - name: Commit generated share pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share
          if git diff --cached --quiet; then
            echo "No share-page changes."
          else
            git commit -m "Update performance social share pages"
            git push
          fi
